<title>Saruhub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style id="css">
/* Layout: 上にアップロード口（持ち主だけに表示）、その下にサル画像が段組みでびっしり並ぶ */
/* 黒一色に決めたテーマ。明るい版は作らず、どの画面でも同じ見た目にする */
:root {
  --bg: #0B0A08;          /* 黒 */
  --ink: #FDFBF3;         /* 白 */
  --muted: #ABA594;
  --zone: #17150F;        /* アップロード口の地 */
  --hot: #FFD21F;         /* バナナの黄色 */
  --danger: #FF5A47;      /* 消すときの赤 */
  --paper: #FDFBF3;       /* 画像の台紙 */
  --shadow: rgba(0, 0, 0, .6);
  --scrim: rgba(0, 0, 0, .92);
  --scrim-ink: #FDFBF3;
  --btn-bg: #FFD21F;
  --btn-fg: #0B0A08;
  --font-display: "Dela Gothic One", "Hiragino Kaku Gothic StdN", "Yu Gothic", "Meiryo", sans-serif;
  --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 1rem;
  line-height: 1.7;
}
.page {
  max-width: 1240px;
  margin-inline: auto;
  padding-inline: 16px;
  padding-block: 20px 56px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* ヘッダー */
.top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 20px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-display);
  font-size: 1.75rem;
  line-height: 1;
}
.logo svg { width: 46px; height: 42px; flex: none; }
.count { font-weight: 700; font-variant-numeric: tabular-nums; }
.count b {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 1.6rem;
  color: var(--hot);
  padding-inline: 4px;
}

h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(1.9rem, 6.2vw, 4rem);
  line-height: 1.1;
  text-wrap: balance;
}
h1 span { color: var(--hot); }

/* ボタン */
.btn {
  font: inherit;
  font-weight: 700;
  line-height: 1.2;
  padding: 11px 20px;
  border-radius: 999px;
  border: 2px solid var(--btn-bg);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
}
.btn:hover { background: color-mix(in srgb, var(--btn-bg) 14%, transparent); }
.btn.main { background: var(--btn-bg); color: var(--btn-fg); font-size: 1.0625rem; padding: 13px 26px; }
.btn.main:hover { background: color-mix(in srgb, var(--btn-bg) 84%, var(--ink)); }
.btn.armed { border-color: var(--danger); color: var(--danger); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: progress; }
:focus-visible { outline: 3px solid var(--hot); outline-offset: 3px; }

/* アップロード口 */
.zone {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 28px 20px;
  border: 3px dashed var(--muted);
  border-radius: 18px;
  background: var(--zone);
  text-align: center;
}
.zone[data-empty="true"] { min-height: min(52vh, 440px); }
.zone[data-empty="false"] {
  flex-direction: row;
  flex-wrap: wrap;
  justify-content: flex-start;
  gap: 10px 18px;
  padding: 14px 18px;
  text-align: left;
}
.face { width: 96px; height: 88px; }
.zone[data-empty="false"] .face,
.zone[data-empty="false"] .zone-title { display: none; }
.zone-title, .empty-title {
  margin: 0;
  font-family: var(--font-display);
  font-size: clamp(1.2rem, 3.4vw, 1.9rem);
  line-height: 1.25;
  text-wrap: balance;
}
.zone-hint { margin: 0; color: var(--muted); font-weight: 700; min-width: 0; }
body.dragging .zone { border-color: var(--hot); border-style: solid; }
body.busy .zone { opacity: .6; }

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 40px 20px;
  text-align: center;
}

/* 前の版でこのブラウザに保存した画像 */
.local {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 16px;
  padding: 14px 18px;
  border: 2px solid var(--hot);
  border-radius: 14px;
  font-weight: 700;
}
.local span { min-width: 0; flex: 1 1 16em; }

/* お知らせ */
.bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 16px;
  min-height: 46px;
}
.toast { margin: 0; font-weight: 700; color: var(--muted); min-width: 0; }

/* 画像の壁 */
.grid { columns: 4 230px; column-gap: 14px; }
.tile {
  position: relative;
  break-inside: avoid;
  margin: 0 0 14px;
  padding: 6px;
  background: var(--paper);
  border-radius: 6px;
  box-shadow: 0 3px 0 var(--shadow), 0 8px 18px var(--shadow);
}
.tile:nth-child(3n) { transform: rotate(-.7deg); }
.tile:nth-child(4n+1) { transform: rotate(.6deg); }
.open { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
.open img { display: block; width: 100%; height: auto; border-radius: 3px; }
.del {
  position: absolute;
  top: 12px;
  right: 12px;
  min-width: 34px;
  height: 34px;
  padding: 0 8px;
  border-radius: 17px;
  border: 2px solid var(--paper);
  background: var(--bg);
  color: var(--ink);
  font: 700 1rem/1 var(--font-body);
  cursor: pointer;
  opacity: .88;
}
.del:hover, .del.armed { background: var(--danger); color: var(--bg); opacity: 1; }

.note { margin: 0; font-size: .875rem; color: var(--muted); max-width: 48em; }

/* 大きく見る */
dialog.viewer {
  border: 0;
  padding: 16px;
  background: transparent;
  color: var(--scrim-ink);
  max-width: 100vw;
  max-height: 100vh;
  overflow: visible;
}
dialog.viewer::backdrop { background: var(--scrim); }
.viewer-inner { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.viewer img { max-width: min(92vw, 1400px); max-height: 74vh; width: auto; height: auto; border-radius: 6px; border: 6px solid var(--paper); background: var(--paper); }
.viewer-name { margin: 0; font-weight: 700; max-width: 90vw; overflow-wrap: anywhere; text-align: center; }
.viewer-ctl { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.viewer .btn { border-color: var(--scrim-ink); color: var(--scrim-ink); }
.viewer .btn:hover { background: color-mix(in srgb, var(--scrim-ink) 18%, transparent); }

@media (max-width: 640px) {
  .grid { columns: 2; column-gap: 10px; }
  .tile { margin-bottom: 10px; padding: 4px; }
  .del { top: 8px; right: 8px; min-width: 30px; height: 30px; }
}
</style>

<div class="page">

    <div class="logo">

          <circle cx="81" cy="46" r="12" fill="#B5A38D"/><circle cx="81" cy="46" r="6.5" fill="#EC7B68"/>
          <circle cx="50" cy="50" r="31" fill="#B5A38D"/>
          <circle cx="40" cy="45" r="12.5" fill="#EC7B68"/><circle cx="60" cy="45" r="12.5" fill="#EC7B68"/>
          <ellipse cx="50" cy="63" rx="19" ry="14.5" fill="#EC7B68"/>
          <path d="M35.5 47q4.5-6 9 0M55.5 47q4.5-6 9 0M42 64.5q8 8 16 0" fill="none" stroke="#2A1A14" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="47.5" cy="57" r="1.1" fill="#2A1A14" opacity=".7"/><circle cx="52.5" cy="57" r="1.1" fill="#2A1A14" opacity=".7"/>

      </svg>
      <span>Saruhub</span>

    <div class="count" aria-live="polite">サル画像<b id="count">0</b>枚</div>

  <h1>サルの画像を<span>貼りまくれ。</span></h1>

  <section class="zone" id="zone" data-empty="true" aria-label="画像のアップロード" hidden>
    <svg class="face" viewBox="4 8 92 84" aria-hidden="true"><use href="#saru"/></svg>
    <p class="zone-title">手持ちのサル画像を、ここにアップロード</p>
    <button class="btn main" id="btnPick" type="button">画像をアップロード</button>
    <p class="zone-hint">何枚でもまとめて選べます。ここへドラッグしても、コピーした画像を貼り付け（Ctrl+V）してもアップロードできます。</p>
    <input id="file" type="file" accept="image/*" multiple hidden>
  </section>

  <div class="empty" id="empty" hidden>
    <svg class="face" viewBox="4 8 92 84" aria-hidden="true"><use href="#saru"/></svg>
    <p class="empty-title">まだサルの画像がありません。</p>
  </div>

  <div class="local" id="localBar" hidden>
    <span id="localText"></span>
    <button class="btn" id="btnLocal" type="button">この画像も公開する</button>
  </div>

  <div class="bar">
    <p class="toast" id="toast" role="status"></p>
    <button class="btn" id="btnClear" type="button" hidden>全部消す</button>
  </div>

  <div class="grid" id="grid"></div>

  <p class="note" id="note" hidden></p>
</div>

<dialog class="viewer" id="viewer" aria-label="画像を大きく表示">
  <div class="viewer-inner">
    <img id="viewerImg" alt="">
    <p class="viewer-name" id="viewerName"></p>
    <div class="viewer-ctl">
      <button class="btn" id="btnPrev" type="button">前へ</button>
      <button class="btn" id="btnNext" type="button">次へ</button>
      <button class="btn" id="btnClose" type="button">閉じる</button>
    </div>
  </div>
</dialog>

<script id="main">
(function () {
  'use strict';

  // ---- このページ自身の「もと」。公開するときはここから作り直す ------------
  // 画面を書きかえる前の状態を最初に取っておく
  var SHELL = document.getElementById('app').innerHTML;
  var CSS = document.getElementById('css').textContent;
  var JS = document.getElementById('main').textContent;
  var HEAD = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
  var FONT = '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">';

  function buildDoc(list) {
    var json = JSON.stringify({ v: 1, items: list }).replace(/</g, '\\u003c');
    return HEAD + '\n<title>Saruhub</title>\n' + FONT + '\n<style id="css">' + CSS + '</style>\n' +
      '<div id="app">' + SHELL + '</div>\n' +
      '<script type="application/json" id="state">' + json + '<\/script>\n' +
      '<script id="main">' + JS + '<\/script>\n</body></html>';
  }
  function byteLen(s) { return new Blob([s]).size; }

  var LIMIT = 15 * 1024 * 1024;     // ページ全体の上限（16MB）より少し手前
  var MAX_EDGE = 1100;              // 長い辺をここまで縮める
  var GIF_KEEP = 1200 * 1024;       // これより小さいGIFは動くまま残す

  // ---- 状態 ------------------------------------------------------------
  var items = [];                   // 新しい順: {id, name, w, h, src}
  try {
    var parsed = JSON.parse(document.getElementById('state').textContent);
    if (parsed && Array.isArray(parsed.items)) {
      items = parsed.items.filter(function (it) { return it && typeof it.src === 'string' && it.src.indexOf('data:image/') === 0; });
    }
  } catch (e) {}

  var artifact = null;
  var editor = false;
  var busy = false;

  var $ = function (id) { return document.getElementById(id); };
  var grid = $('grid'), zone = $('zone'), emptyEl = $('empty'), countEl = $('count');
  var toastEl = $('toast'), btnClear = $('btnClear'), noteEl = $('note'), fileInput = $('file');
  var localBar = $('localBar'), localText = $('localText'), btnLocal = $('btnLocal');

  function toast(msg) { toastEl.textContent = msg; }
  function setBusy(on, msg) {
    busy = on;
    document.body.classList.toggle('busy', on);
    ['btnPick', 'btnClear', 'btnLocal'].forEach(function (id) { $(id).disabled = on; });
    if (msg) toast(msg);
  }
  function flash(msg) { try { sessionStorage.setItem('saruhub-flash', msg); } catch (e) {} }
  function takeFlash() {
    try {
      var m = sessionStorage.getItem('saruhub-flash');
      sessionStorage.removeItem('saruhub-flash');
      return m;
    } catch (e) { return null; }
  }

  // ---- 表示 ------------------------------------------------------------
  function render() {
    grid.textContent = '';
    items.forEach(function (it) {
      var fig = document.createElement('figure');
      fig.className = 'tile';

      var open = document.createElement('button');
      open.type = 'button';
      open.className = 'open';
      open.setAttribute('aria-label', (it.name || '画像') + ' を大きく表示');
      var img = document.createElement('img');
      img.alt = it.name || 'サルの画像';
      img.loading = 'lazy';
      if (it.w && it.h) { img.width = it.w; img.height = it.h; }
      img.src = it.src;
      open.appendChild(img);
      open.addEventListener('click', function () { showViewer(items.indexOf(it)); });
      fig.appendChild(open);

      if (editor) {
        var del = document.createElement('button');
        del.type = 'button';
        del.className = 'del';
        del.textContent = '×';
        del.setAttribute('aria-label', (it.name || '画像') + ' を消す');
        var timer = 0;
        del.addEventListener('click', function () {
          if (busy) return;
          if (!timer) {
            del.classList.add('armed');
            del.textContent = '消す？';
            timer = setTimeout(function () { timer = 0; del.classList.remove('armed'); del.textContent = '×'; }, 3000);
            return;
          }
          clearTimeout(timer);
          commit(items.filter(function (x) { return x !== it; }), '1枚消しました。');
        });
        fig.appendChild(del);
      }
      grid.appendChild(fig);
    });

    countEl.textContent = items.length;
    zone.hidden = !editor;
    zone.dataset.empty = items.length ? 'false' : 'true';
    emptyEl.hidden = editor || items.length > 0;
    btnClear.hidden = !editor || items.length === 0;
    noteEl.hidden = !editor;
    if (editor) {
      var mb = (byteLen(buildDoc(items)) / 1048576).toFixed(1);
      noteEl.textContent = 'アップロードした画像は、このページを共有した相手にも表示されます。画像を追加・削除できるのは、あなたと、編集を許可した人だけです。使用中の容量：' + mb + ' / 15 MB';
    }
  }

  // ---- 公開（ページ自身を新しい内容で保存しなおす） --------------------
  function becomeReadOnly() {
    editor = false;
    render();
    localBar.hidden = true;
    toast('このページは見るだけの状態です。画像を追加・削除できるのは、持ち主と編集を許可された人だけです。');
  }

  function publishWithRetry(html) {
    return artifact.publish(html).catch(function (err) {
      var code = err && err.code;
      var known = ['conflict', 'not_writer', 'not_declared', 'too_large', 'invalid_content', 'read_only_path',
        'rate_limited', 'consent_required', 'not_granted', 'capability_disabled', 'capability_removed', 'transform_error'];
      if (known.indexOf(code) > -1) throw err;
      // 一時的な失敗は、少し待って1回だけやり直す
      return new Promise(function (res) { setTimeout(res, 600 + Math.random() * 900); })
        .then(function () { return artifact.publish(html); });
    });
  }

  // next: 公開したい画像の並び。成功すると true。
  function commit(next, okMsg) {
    if (!artifact || !editor) return Promise.resolve(false);
    var html = buildDoc(next);
    if (byteLen(html) > LIMIT) {
      setBusy(false);
      toast('容量がいっぱいです（上限15MB）。画像をいくつか消してから、もう一度アップロードしてください。');
      return Promise.resolve(false);
    }
    setBusy(true, '公開しています。そのままお待ちください。');
    flash(okMsg);
    return publishWithRetry(html).then(function () {
      // ふつうはここでページが新しい版に読み込み直される
      items = next;
      setBusy(false);
      render();
      toast(okMsg);
      setTimeout(takeFlash, 4000);
      return true;
    }, function (err) {
      takeFlash();
      setBusy(false);
      var code = err && err.code;
      if (code === 'conflict') {
        toast('ほかの画面で先に更新されたため、今回の変更は反映されませんでした。最新の状態を読み込みます。');
      } else if (code === 'too_large') {
        toast('容量がいっぱいです。画像をいくつか消してから、もう一度アップロードしてください。');
      } else if (code === 'rate_limited') {
        toast('短い時間に何度も公開したため、受け付けられませんでした。少し待ってからもう一度お試しください。');
      } else if (['not_writer', 'not_granted', 'not_declared', 'consent_required', 'capability_disabled', 'capability_removed'].indexOf(code) > -1) {
        becomeReadOnly();
      } else {
        toast('公開できませんでした。少し待ってからもう一度お試しください。');
      }
      render();
      return false;
    });
  }

  // ---- 画像を準備する（縮めて、ページに入れられる形にする） ------------
  function loadImage(url) {
    return new Promise(function (ok, ng) {
      var im = new Image();
      im.onload = function () { ok(im); };
      im.onerror = function () { ng(new Error('load')); };
      im.src = url;
    });
  }
  function readDataURL(blob) {
    return new Promise(function (ok, ng) {
      var r = new FileReader();
      r.onload = function () { ok(String(r.result)); };
      r.onerror = function () { ng(new Error('read')); };
      r.readAsDataURL(blob);
    });
  }
  function toItem(blob, name) {
    var url = URL.createObjectURL(blob);
    var id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    return loadImage(url).then(function (im) {
      var w = im.naturalWidth, h = im.naturalHeight;
      if (!w || !h) throw new Error('size');
      if (blob.type === 'image/gif' && blob.size <= GIF_KEEP) {
        return readDataURL(blob).then(function (src) { return { id: id, name: name, w: w, h: h, src: src }; });
      }
      var k = Math.min(1, MAX_EDGE / Math.max(w, h));
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w * k));
      c.height = Math.max(1, Math.round(h * k));
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(im, 0, 0, c.width, c.height);
      var src = c.toDataURL('image/webp', 0.82);
      if (src.indexOf('data:image/webp') !== 0) src = c.toDataURL('image/jpeg', 0.82);
      return { id: id, name: name, w: c.width, h: c.height, src: src };
    }).then(function (it) { URL.revokeObjectURL(url); return it; },
            function (e) { URL.revokeObjectURL(url); throw e; });
  }

  // entries: [{blob, name}]。準備できた画像と、入らなかった数を返す
  function prepare(entries) {
    var out = [], failed = 0, noRoom = 0;
    var used = byteLen(buildDoc(items));
    var chain = Promise.resolve();
    entries.forEach(function (en) {
      chain = chain.then(function () {
        if (noRoom) { noRoom++; return; }
        return toItem(en.blob, en.name).then(function (it) {
          var cost = it.src.length + 200;
          if (used + cost > LIMIT) { noRoom++; return; }
          used += cost;
          out.push(it);
        }, function () { failed++; });
      });
    });
    return chain.then(function () { return { items: out, failed: failed, noRoom: noRoom }; });
  }

  function addFiles(fileList) {
    if (!editor || busy) return;
    var imgs = Array.prototype.filter.call(fileList || [], function (f) { return /^image\//.test(f.type); });
    if (!imgs.length) {
      toast('画像ファイルが見つかりませんでした。JPEG・PNG・GIFなどの画像を選んでください。');
      return;
    }
    setBusy(true, imgs.length + '枚の画像を準備しています。');
    prepare(imgs.map(function (f) { return { blob: f, name: f.name || '貼り付けた画像' }; })).then(function (r) {
      var extra = '';
      if (r.failed) extra += r.failed + '枚は読み込めませんでした。';
      if (r.noRoom) extra += r.noRoom + '枚は容量が足りず入りませんでした。';
      if (!r.items.length) { setBusy(false); toast('アップロードできませんでした。' + extra); return; }
      return commit(r.items.concat(items), r.items.length + '枚アップロードしました。' + extra);
    });
  }

  $('btnPick').addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () { addFiles(fileInput.files); fileInput.value = ''; });

  document.addEventListener('paste', function (e) {
    if (!editor) return;
    var files = e.clipboardData && e.clipboardData.files;
    if (files && files.length) { e.preventDefault(); addFiles(files); }
  });
  function hasFiles(e) {
    var t = e.dataTransfer && e.dataTransfer.types;
    return !!t && Array.prototype.indexOf.call(t, 'Files') > -1;
  }
  document.addEventListener('dragover', function (e) {
    if (!editor || !hasFiles(e)) return;
    e.preventDefault();
    document.body.classList.add('dragging');
  });
  document.addEventListener('dragleave', function (e) {
    if (!e.relatedTarget) document.body.classList.remove('dragging');
  });
  document.addEventListener('drop', function (e) {
    if (!editor || !hasFiles(e)) return;
    e.preventDefault();
    document.body.classList.remove('dragging');
    addFiles(e.dataTransfer.files);
  });

  var armTimer = 0;
  function disarm() {
    clearTimeout(armTimer); armTimer = 0;
    btnClear.classList.remove('armed');
    btnClear.textContent = '全部消す';
  }
  btnClear.addEventListener('click', function () {
    if (busy) return;
    if (!armTimer) {
      btnClear.classList.add('armed');
      btnClear.textContent = 'もう一度押すと全部消えます';
      armTimer = setTimeout(disarm, 3500);
      return;
    }
    disarm();
    commit([], '全部消しました。');
  });

  // ---- 前の版でこのブラウザにだけ保存していた画像を引きつぐ ------------
  var localDB = null, localRecs = [];
  function openLocal() {
    return new Promise(function (res) {
      try {
        var q = indexedDB.open('saruhub-gallery', 1);
        q.onupgradeneeded = function () { q.result.createObjectStore('imgs', { keyPath: 'id', autoIncrement: true }); };
        q.onsuccess = function () {
          localDB = q.result;
          try {
            var g = localDB.transaction('imgs').objectStore('imgs').getAll();
            g.onsuccess = function () { res(g.result || []); };
            g.onerror = function () { res([]); };
          } catch (e) { res([]); }
        };
        q.onerror = function () { res([]); };
      } catch (e) { res([]); }
    });
  }
  function clearLocal() {
    try { localDB.transaction('imgs', 'readwrite').objectStore('imgs').clear(); } catch (e) {}
  }
  function checkLocal() {
    openLocal().then(function (recs) {
      var pending = false;
      try { pending = sessionStorage.getItem('saruhub-clear-local') === '1'; sessionStorage.removeItem('saruhub-clear-local'); } catch (e) {}
      if (pending) { clearLocal(); return; }
      localRecs = recs.filter(function (r) { return r && r.blob; }).sort(function (a, b) { return b.id - a.id; });
      if (!localRecs.length || !editor) return;
      localText.textContent = '前にこのブラウザへ保存した画像が' + localRecs.length + '枚あります。ほかの人には、まだ見えていません。';
      localBar.hidden = false;
    });
  }
  btnLocal.addEventListener('click', function () {
    if (busy || !localRecs.length) return;
    setBusy(true, localRecs.length + '枚の画像を準備しています。');
    prepare(localRecs.map(function (r) { return { blob: r.blob, name: r.name || 'サルの画像' }; })).then(function (r) {
      if (!r.items.length) { setBusy(false); toast('画像を準備できませんでした。'); return; }
      var extra = r.noRoom ? r.noRoom + '枚は容量が足りず入りませんでした。' : '';
      try { sessionStorage.setItem('saruhub-clear-local', '1'); } catch (e) {}
      return commit(r.items.concat(items), r.items.length + '枚を公開しました。' + extra).then(function (ok) {
        if (ok) { clearLocal(); localBar.hidden = true; }
        try { sessionStorage.removeItem('saruhub-clear-local'); } catch (e) {}
      });
    });
  });

  // ---- 大きく見る ------------------------------------------------------
  var viewer = $('viewer'), viewerImg = $('viewerImg'), viewerName = $('viewerName');
  var cur = 0;
  function showViewer(i) {
    if (!items.length) return;
    cur = (i + items.length) % items.length;
    viewerImg.src = items[cur].src;
    viewerImg.alt = items[cur].name || 'サルの画像';
    viewerName.textContent = (cur + 1) + ' / ' + items.length + '　' + (items[cur].name || '');
    if (!viewer.open) { try { viewer.showModal(); } catch (e) { viewer.setAttribute('open', ''); } }
  }
  $('btnPrev').addEventListener('click', function () { showViewer(cur - 1); });
  $('btnNext').addEventListener('click', function () { showViewer(cur + 1); });
  $('btnClose').addEventListener('click', function () { viewer.close(); });
  viewer.addEventListener('click', function (e) { if (e.target === viewer) viewer.close(); });
  viewer.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') showViewer(cur - 1);
    if (e.key === 'ArrowRight') showViewer(cur + 1);
  });

  // ---- 起動：まず全員に画像を見せ、編集できる人にだけアップロード口を出す ----
  render();
  var first = takeFlash();
  if (first) toast(first);

  var claude = window.claude;
  if (claude && typeof claude.use === 'function') {
    Promise.all([claude.use('artifact'), claude.use('user')]).then(function (ns) {
      artifact = ns[0];
      if (!artifact) return false;
      // 編集できるかどうかを先に確かめる。わからないときは出しておき、断られたら見るだけにする
      return ns[1] ? ns[1].canEdit() : true;
    }).then(function (can) {
      editor = !!can;
      if (editor) { render(); checkLocal(); }
    }).catch(function () {});
  }
})();
</script>

</body></html>
